name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    # `prisma.config.js` throws without a connection string, and /sitemap.xml
    # queries the database during static export, so `pnpm build` needs a real
    # server rather than just a URL.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grantmatch-ai-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Throwaway CI values. These are not secrets and must never be reused
      # anywhere else; the ephemeral database is destroyed with the runner.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/grantmatch-ai-postgres
      NEXTAUTH_SECRET: ci-placeholder-secret-not-a-real-key
      NEXTAUTH_URL: http://localhost:3005
      NEXT_PUBLIC_APP_URL: http://localhost:3005
      CRON_SECRET: ci-placeholder-cron-secret
      # src/lib/mail.ts and src/lib/auth.ts throw at module evaluation when
      # these are absent, so `next build` cannot collect page data without
      # them. Placeholders are enough because nothing contacts Resend or
      # Google during a build.
      RESEND_API_KEY: re_ci_placeholder_not_a_real_key
      RESEND_FROM_EMAIL: ci@example.com
      GOOGLE_CLIENT_ID: ci-placeholder-google-client-id
      GOOGLE_CLIENT_SECRET: ci-placeholder-google-client-secret

    steps:
      - uses: actions/checkout@v7

      # pnpm/action-setup is superseded by pnpm/setup, but that action requires
      # pnpm v11+ while this repo is on pnpm 10 with a lockfileVersion 9.0
      # lockfile. Staying here keeps CI on the same pnpm major as local
      # development; switch once the repo moves to pnpm 11.
      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Also fails the build if pnpm-lock.yaml has drifted from package.json.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Everything below typechecks against the generated client, so this has
      # to happen before lint and typecheck rather than only inside `build`.
      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Apply migrations
        run: pnpm prisma migrate deploy

      - name: Build
        run: pnpm build
